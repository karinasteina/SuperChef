<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title th:text="${user.username} + ' Profile'"></title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="anonymous" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/create-recipe.css}"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>

</head>
<body>

<!-- ====== NAVBAR ====== -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ====== MAIN PAGE ====== -->
<main class="recipe-list-page">
    <header class="page-header">
        <h1 class="page-title" th:text="${user.username} + ' Profile'"></h1>
    </header>
    <div th:if="${user != null}">
        <p>Name: <span th:text="${user.username}"></span></p>

        <p>Role:
            <span th:text="${#strings.capitalize(#strings.toLowerCase(#strings.substringAfter(user.role.name(), 'ROLE_')))}"></span>
        </p>
        <p><span th:text="${profile.getDisplayName()}"></span></p>
    </div>

</main>

<!-- ====== FOOTER ====== -->
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
