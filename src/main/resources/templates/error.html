<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="anonymous"
          href="https://fonts.gstatic.com"
          rel="preconnect"/>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/error.css}"/>

    <title th:text="|${status} Error - SuperChef|">Error - SuperChef</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="error-page">
    <section aria-labelledby="error-status" class="error-content">
        <img alt="A puzzled chef looking into an empty cooking pot"
             class="error-illustration"
             height="800"
             src="/images/error-chef.webp"
             th:src="@{/images/error-chef.webp}"
             width="800"/>
        <h1 class="error-status" id="error-status" th:text="${status}">500</h1>
        <p class="error-page__message" th:text="${message}">An unexpected error occurred.</p>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
