<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">

<!--/*@thymesVar id="recipe" type="lv.superchef.app.model.Recipe"*/-->
<!--/*@thymesVar id="loggedIn" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="favoriteRecipeIds" type="java.util.Set<java.lang.Long>"*/-->

<head>
    <meta charset="UTF-8"/>

    <meta
            content="width=device-width, initial-scale=1.0"
            name="viewport"
    />

    <title th:text="${recipe.title + ' | SuperChef'}">
        Recipe | SuperChef
    </title>

    <link
            href="https://fonts.googleapis.com"
            rel="preconnect"
    />

    <link
            crossorigin="anonymous"
            href="https://fonts.gstatic.com"
            rel="preconnect"
    />

    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
    />

    <link
            rel="stylesheet"
            th:href="@{/css/create-recipe.css}"
    />

    <link
            rel="stylesheet"
            th:href="@{/css/main.css}"
    />

    <link
            rel="stylesheet"
            th:href="@{/css/recipe-list.css}"
    />
    <link rel="stylesheet" th:href="@{/css/favorite-button.css}"/>
    <link rel="stylesheet" th:href="@{/css/reviews.css}"/>
</head>

<body>

<!-- ====== NAVBAR ====== -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ====== MAIN PAGE ====== -->
<main class="recipe-list-page">

    <header class="page-header">
        <h1
                class="page-title"
                th:text="${recipe.title}"
        >
            Recipe title
        </h1>
    </header>

    <ol class="recipe-list recipe-list--single">
        <li>
            <div th:replace="~{fragments/recipe-card
                :: recipeCard(
                    ${recipe},
                    false,
                    'eager',
                    ${loggedIn},
                    ${favoriteRecipeIds != null
                        and favoriteRecipeIds.contains(recipe.id)}
                )}">
            </div>
        </li>
    </ol>


    <section class="reviews-section" sec:authorize="isAuthenticated()">

        <header class="reviews-header">
            <h2>Reviews</h2>

            <div class="average-rating">
            <span
                    class="average-rating-number"
                    th:text="${#numbers.formatDecimal(averageRating, 1, 1)}"
            >
                0.0
            </span>

                <div
                        class="display-stars"
                        th:aria-label="|Average rating: ${averageRating} out of 5|"
                >
                <span
                        th:classappend="${star <= averageRating} ? 'filled' : ''"
                        th:each="star : ${#numbers.sequence(1, 5)}"
                >
                    ★
                </span>
                </div>

                <span th:text="|(${reviewCount} reviews)|">
                (0 reviews)
            </span>
            </div>
        </header>

        <p
                class="review-success"
                th:if="${reviewSuccess}"
                th:text="${reviewSuccess}"
        ></p>

        <p
                class="review-error"
                th:if="${reviewError}"
                th:text="${reviewError}"
        ></p>

        <!-- Create or edit review -->
        <form
                class="review-form"
                method="post"
                th:action="@{/recipes/{recipeId}/reviews(recipeId=${recipe.id})}"
                th:if="${loggedIn}"
                th:object="${reviewForm}"
        >
            <fieldset class="rating-fieldset">
                <legend>Your rating</legend>

                <div class="star-rating">

                    <input
                            id="rating-5"
                            th:field="*{rating}"
                            type="radio"
                            value="5"
                    />
                    <label for="rating-5" title="5 stars">★</label>

                    <input
                            id="rating-4"
                            th:field="*{rating}"
                            type="radio"
                            value="4"
                    />
                    <label for="rating-4" title="4 stars">★</label>

                    <input
                            id="rating-3"
                            th:field="*{rating}"
                            type="radio"
                            value="3"
                    />
                    <label for="rating-3" title="3 stars">★</label>

                    <input
                            id="rating-2"
                            th:field="*{rating}"
                            type="radio"
                            value="2"
                    />
                    <label for="rating-2" title="2 stars">★</label>

                    <input
                            id="rating-1"
                            th:field="*{rating}"
                            type="radio"
                            value="1"
                    />
                    <label for="rating-1" title="1 star">★</label>

                </div>

                <p
                        class="field-error"
                        th:errors="*{rating}"
                        th:if="${#fields.hasErrors('rating')}"
                ></p>
            </fieldset>

            <div class="review-comment-field">
                <label for="review-comment">
                    Comment
                </label>

                <textarea
                        id="review-comment"
                        maxlength="2000"
                        placeholder="Share your experience with this recipe"
                        rows="5"
                        th:field="*{comment}"
                ></textarea>

                <p
                        class="field-error"
                        th:errors="*{comment}"
                        th:if="${#fields.hasErrors('comment')}"
                ></p>
            </div>

            <button
                    class="review-submit-button"
                    th:text="${editingReview ? 'Update review' : 'Submit review'}"
                    type="submit"
            >
                Submit review
            </button>
        </form>

        <p th:unless="${loggedIn}">
            <a th:href="@{/login}">Log in</a>
            to leave a review.
        </p>

        <!-- Existing reviews -->
        <div class="review-list">

            <p th:if="${#lists.isEmpty(reviews)}">
                No reviews yet.
            </p>

            <article
                    class="review-card"
                    th:each="review : ${reviews}"
            >
                <header class="review-card-header">
                    <strong th:text="${review.profile.displayName}">
                        Username
                    </strong>

                    <div
                            class="display-stars"
                            th:aria-label="|${review.rating} out of 5 stars|"
                    >
                    <span
                            th:classappend="${star <= review.rating} ? 'filled' : ''"
                            th:each="star : ${#numbers.sequence(1, 5)}"
                    >
                        ★
                    </span>
                    </div>
                </header>

                <p
                        class="review-comment"
                        th:text="${review.comment}"
                >
                    Review comment
                </p>

                <time
                        class="review-date"
                        th:datetime="${review.createdAt}"
                        th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}"
                >
                    Review date
                </time>
            </article>

        </div>

    </section>

</main>

<!-- ====== FOOTER ====== -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- ====== FAVORITES SCRIPT ====== -->
<script defer th:src="@{/js/favorites.js}"></script>

</body>
</html>
