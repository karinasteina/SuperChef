<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Recipes | SuperChef</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="anonymous" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/create-recipe.css}"/>
    <style>
        .recipe-list-page {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 16px 60px;
        }

        .recipe-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            list-style: none;
        }

        .recipe-card {
            height: 100%;
            padding: 28px;
            overflow: hidden;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
        }

        .recipe-image {
            display: block;
            width: calc(100% + 56px);
            height: 230px;
            margin: -28px -28px 24px;
            object-fit: cover;
        }

        .recipe-card h2 {
            margin-bottom: 8px;
            font-size: 1.35rem;
            color: var(--color-text);
        }

        .recipe-description {
            margin-bottom: 18px;
            color: var(--color-text-muted);
        }

        .recipe-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .recipe-meta span {
            padding: 5px 10px;
            background: var(--color-primary-light);
            border-radius: var(--radius-full);
            color: var(--color-primary-dark);
            font-size: .8rem;
            font-weight: 600;
        }

        .recipe-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .recipe-details h3 {
            margin-bottom: 8px;
            font-size: .95rem;
        }

        .recipe-details ul,
        .recipe-details ol {
            padding-left: 20px;
            color: var(--color-text-muted);
            font-size: .86rem;
        }

        .recipe-details li + li {
            margin-top: 6px;
        }

        @media (max-width: 760px) {
            .recipe-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .recipe-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- ====== NAVBAR ====== -->
<nav class="navbar">
    <a class="navbar-brand" href="/">
        <span class="brand-icon">🍳</span>
        <span class="brand-name">SuperChef</span>
    </a>
    <ul class="navbar-links">
        <li><a class="active" href="/">Feed</a></li>
        <li><a href="/recipes/create">Create Recipe</a></li>
        <li><a href="/profile">My Profile</a></li>
    </ul>
</nav>

<!-- ====== MAIN PAGE ====== -->
<main class="recipe-list-page">
    <header class="page-header">
        <h1 class="page-title">Discover Recipes</h1>
    </header>

    <ol class="recipe-list">
        <li th:each="recipe, recipeStatus : ${recipes}">
            <article class="recipe-card">
                <img alt="Recipe"
                     class="recipe-image"
                     height="397"
                     src="/images/recipes/recipe-00.webp"
                     th:alt="|Photo of ${recipe.title}|"
                     th:loading="${recipeStatus.first} ? 'eager' : 'lazy'"
                     th:src="|/images/recipes/recipe-${#numbers.formatInteger(recipeStatus.index, 2)}.webp|"
                     width="397"/>

                <h2 th:text="${recipe.title}">Recipe title</h2>
                <p class="recipe-description" th:text="${recipe.description}">Recipe description</p>

                <div class="recipe-meta">
                    <span th:text="|${recipe.calories} kcal|">0 kcal</span>
                    <span th:text="|Prep: ${recipe.preparationTime} min|">Prep: 0 min</span>
                    <span th:text="|Cook: ${recipe.cookingTime} min|">Cook: 0 min</span>
                    <span th:text="${recipe.difficulty}">Difficulty</span>
                    <span th:text="${recipe.category}">Category</span>
                </div>

                <div class="recipe-details">
                    <section>
                        <h3>Ingredients</h3>
                        <ul>
                            <li th:each="ingredient : ${recipe.ingredients}">
                                <span th:text="${ingredient.quantity}">Quantity</span>
                                <span th:text="${ingredient.name}">Ingredient</span>
                            </li>
                        </ul>
                    </section>

                    <section>
                        <h3>Steps</h3>
                        <ol>
                            <li th:each="step : ${recipe.steps}" th:text="${step}">Recipe step</li>
                        </ol>
                    </section>
                </div>
            </article>
        </li>
    </ol>
</main>

<!-- ====== FOOTER ====== -->
<footer class="footer">
    <p>&copy; 2026 SuperChef. Made with ❤️ for food lovers.</p>
</footer>
</body>
</html>
