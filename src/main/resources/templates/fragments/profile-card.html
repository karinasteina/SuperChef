<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<article class="form-container"
         th:fragment="profileCard(profile, linkToProfile, canFollow, following, returnTo)">
    <img height="144"
         loading="lazy"
         th:alt="|${profile.displayName}'s profile picture|"
         th:src="${profile.profileImageUrl}"
         width="144"/>

    <h2 th:text="${profile.displayName}">Chef name</h2>
    <p class="page-subtitle" th:text="${profile.bio}">Chef biography</p>

    <div class="form-actions" th:if="${linkToProfile or canFollow}">
        <a class="btn btn--secondary"
           th:href="@{/profile/{id}(id=${profile.id})}"
           th:if="${linkToProfile}">View profile</a>

        <form method="post"
              th:action="@{/profiles/follow/{id}(id=${profile.id})}"
              th:if="${canFollow and !following}">
            <input name="returnTo" th:value="${returnTo}" type="hidden"/>
            <button class="btn btn--primary" type="submit">Follow</button>
        </form>

        <form method="post"
              th:action="@{/profiles/unfollow/{id}(id=${profile.id})}"
              th:if="${canFollow and following}">
            <input name="returnTo" th:value="${returnTo}" type="hidden"/>
            <button class="btn btn--secondary" type="submit">Unfollow</button>
        </form>
    </div>
</article>

</body>
</html>
