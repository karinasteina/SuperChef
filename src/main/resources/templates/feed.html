<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>

    <meta
            content="width=device-width, initial-scale=1.0"
            name="viewport"
    />

    <title>Feed | SuperChef</title>

    <link
            href="https://fonts.googleapis.com"
            rel="preconnect"
    />

    <link
            crossorigin="anonymous"
            href="https://fonts.gstatic.com"
            rel="preconnect"
    />

    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
    />

    <link
            rel="stylesheet"
            th:href="@{/css/create-recipe.css}"
    />

    <link
            rel="stylesheet"
            th:href="@{/css/main.css}"
    />

    <link
            rel="stylesheet"
            th:href="@{/css/recipe-list.css}"
    />
    <link rel="stylesheet" th:href="@{/css/favorite-button.css}"/>
</head>

<body>

<!-- ====== NAVBAR ====== -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ====== MAIN PAGE ====== -->
<main class="recipe-list-page">

    <header class="page-header">
        <h1 class="page-title">Feed</h1>
    </header>

    <!-- No recipes -->
    <div
            class="form-container"
            th:if="${#lists.isEmpty(recipes)}"
    >
        <h2>No recipes available</h2>

        <p class="page-subtitle">
            There are currently no recipes in the feed.
        </p>
    </div>

    <!-- Recipe list -->
    <ol
            class="recipe-list recipe-list--single"
            th:unless="${#lists.isEmpty(recipes)}"
    >
        <li th:each="recipe, status : ${recipes}">

            <article class="recipe-card">

                <!-- Recipe image -->
                <a th:href="@{/recipes/{id}(id=${recipe.id})}">
                    <img
                            alt="Recipe"
                            class="recipe-image"
                            height="397"
                            src="/images/recipes/recipe-00.webp"
                            th:alt="|Photo of ${recipe.title}|"
                            th:loading="${status.first ? 'eager' : 'lazy'}"
                            th:src="${recipe.imageUrl}"
                            width="397"
                    />
                </a>

                <!-- Recipe title -->
                <a th:href="@{/recipes/{id}(id=${recipe.id})}">
                    <h2 th:text="${recipe.title}">
                        Recipe title
                    </h2>
                </a>

                <!-- Recipe description -->
                <p
                        class="recipe-description"
                        th:text="${recipe.description}"
                >
                    Recipe description
                </p>

                <!-- Recipe information -->
                <div class="recipe-meta">

                    <span th:text="|${recipe.calories} kcal|">
                        0 kcal
                    </span>

                    <span th:text="|Prep: ${recipe.preparationTime} min|">
                        Prep: 0 min
                    </span>

                    <span th:text="|Cook: ${recipe.cookingTime} min|">
                        Cook: 0 min
                    </span>

                    <span th:text="${recipe.difficulty}">
                        Difficulty
                    </span>

                    <span th:text="${recipe.category}">
                        Category
                    </span>

                </div>

                <!-- Favorite button -->
                <div th:if="${loggedIn}">
                    <div
                            th:replace="~{fragments/favorite-button
                                :: favoriteButton(
                                    ${recipe.id},
                                    ${favoriteRecipeIds != null
                                        and favoriteRecipeIds.contains(recipe.id)}
                                )}"
                    ></div>
                </div>

                <!-- Recipe details -->
                <div class="recipe-details">

                    <!-- Ingredients -->
                    <section>
                        <h3>Ingredients</h3>

                        <ul>
                            <li th:each="ingredient : ${recipe.ingredients}">

                                <span
                                        th:text="${#numbers.formatDecimal(
                                            ingredient.quantity,
                                            1,
                                            0
                                        )}"
                                >
                                    Amount
                                </span>

                                <span
                                        th:text="${#strings.toLowerCase(
                                            ingredient.unit.name()
                                        )}"
                                >
                                    Unit
                                </span>

                                <span th:text="${ingredient.ingredientName}">
                                    Ingredient
                                </span>

                            </li>
                        </ul>
                    </section>

                    <!-- Steps -->
                    <section>
                        <h3>Steps</h3>

                        <ol>
                            <li
                                    th:each="step : ${recipe.steps}"
                                    th:text="${step.instruction}"
                            >
                                Recipe step
                            </li>
                        </ol>
                    </section>

                </div>

            </article>

        </li>
    </ol>

</main>

<!-- ====== FOOTER ====== -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- ====== FAVORITES SCRIPT ====== -->
<script defer th:src="@{/js/favorites.js}"></script>

</body>
</html>
