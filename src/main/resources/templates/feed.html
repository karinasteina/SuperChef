<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>

    <meta
            content="width=device-width, initial-scale=1.0"
            name="viewport"
    />

    <title>Feed | SuperChef</title>

    <link
            href="https://fonts.googleapis.com"
            rel="preconnect"
    />

    <link
            crossorigin="anonymous"
            href="https://fonts.gstatic.com"
            rel="preconnect"
    />

    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
    />

    <link
            rel="stylesheet"
            th:href="@{/css/create-recipe.css}"
    />

    <link
            rel="stylesheet"
            th:href="@{/css/main.css}"
    />

    <link
            rel="stylesheet"
            th:href="@{/css/recipe-list.css}"
    />
    <link rel="stylesheet" th:href="@{/css/favorite-button.css}"/>
</head>

<body>

<!-- ====== NAVBAR ====== -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ====== MAIN PAGE ====== -->
<main class="recipe-list-page">

    <header class="page-header">
        <h1 class="page-title">Feed</h1>
    </header>

    <!-- No recipes -->
    <div
            class="form-container"
            th:if="${#lists.isEmpty(recipes)}"
    >
        <h2>No recipes available</h2>

        <p class="page-subtitle">
            There are currently no recipes in the feed.
        </p>
    </div>

    <!-- Recipe list -->
    <ol
            class="recipe-list recipe-list--single"
            th:unless="${#lists.isEmpty(recipes)}"
    >
        <li th:each="recipe, status : ${recipes}">

            <div th:replace="~{fragments/recipe-card
                :: recipeCard(
                    ${recipe},
                    true,
                    ${status.first ? 'eager' : 'lazy'},
                    ${loggedIn},
                    ${favoriteRecipeIds != null
                        and favoriteRecipeIds.contains(recipe.id)}
                )}">
            </div>

        </li>
    </ol>

</main>

<!-- ====== FOOTER ====== -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- ====== FAVORITES SCRIPT ====== -->
<script defer th:src="@{/js/favorites.js}"></script>

</body>
</html>
