<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0"
          name="viewport"/>

    <title>Favorite Recipes | SuperChef</title>

    <link href="https://fonts.googleapis.com"
          rel="preconnect"/>

    <link crossorigin="anonymous"
          href="https://fonts.gstatic.com"
          rel="preconnect"/>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/recipes.css}"/>
</head>

<body>

<!-- ====== NAVBAR ====== -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ====== MAIN PAGE ====== -->
<main class="page-shell">

    <header class="page-header">
        <h1 class="page-title">Favorite Recipes</h1>

        <p class="page-subtitle">
            All the recipes you have saved in one place.
        </p>
    </header>

    <!-- Favorite recipe count -->
    <p aria-live="polite"
       class="page-subtitle recipe-results-count"
       th:text="|${#lists.size(recipes)} favorite recipes|">
        0 favorite recipes
    </p>

    <!-- No favorites -->
    <div class="form-container"
         th:if="${#lists.isEmpty(recipes)}">

        <h2>No favorite recipes yet</h2>

        <p class="page-subtitle">
            Browse the recipe collection and save recipes you would like
            to prepare later.
        </p>

        <a class="btn btn--secondary"
           th:href="@{/recipes}">
            Discover recipes
        </a>
    </div>

    <!-- Favorite recipe list -->
    <ol class="recipe-list recipe-list--single"
        th:unless="${#lists.isEmpty(recipes)}">

        <li th:each="recipe, status : ${recipes}">

            <div th:replace="~{fragments/recipe-card
                :: recipeCard(
                    ${recipe},
                    true,
                    ${status.first ? 'eager' : 'lazy'},
                    true,
                    true
                )}">
            </div>

        </li>

    </ol>

</main>

<!-- ====== FOOTER ====== -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script defer
        th:src="@{/js/favorites.js}">
</script>

</body>
</html>
