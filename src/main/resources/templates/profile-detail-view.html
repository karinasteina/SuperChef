<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title th:text="${profile.displayName + ' | SuperChef'}">Chef Profile | SuperChef</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="anonymous" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-shell page-shell--narrow">
    <header class="page-header">
        <h1 class="page-title" th:text="${profile.displayName}">Chef Profile</h1>
    </header>

    <div th:replace="~{fragments/profile-card :: profileCard(
        ${profile},
        false,
        ${currentProfileId != null and profile.id != currentProfileId},
        ${followedProfileIds.contains(profile.id)},
        'profile'
    )}"></div>

    <div class="form-actions">
        <a class="btn btn--secondary" th:href="@{/profiles}">Browse all chefs</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
