<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Sign Up | SuperChef</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<main class="auth-page">
    <section class="auth-card">

        <!-- Logo -->
        <a class="brand" th:href="@{/home}">
            <img
                    alt="SuperChef logo"
                    class="brand-icon"
                    th:src="@{/images/chef-logo.png}"
            >

            <span>SuperChef</span>
        </a>

        <!-- Login / Sign-up navigation -->
        <nav aria-label="Authentication navigation" class="auth-tabs">
            <a class="auth-tab" th:href="@{/login}">
                Log In
            </a>

            <a class="auth-tab active" th:href="@{/register}">
                Sign Up
            </a>
        </nav>

        <!-- Registration form -->
        <form
                class="auth-form"
                method="post"
                th:action="@{/register}"
                th:object="${registerRequest}"
        >
            <div class="form-field">
                <label for="username">Username</label>

                <input
                        autocomplete="username"
                        id="username"
                        maxlength="15"
                        minlength="5"
                        pattern="[A-Za-z]{5,15}"
                        placeholder="Enter your username"
                        required
                        th:field="*{username}"
                        title="Username must contain 5 to 15 letters"
                        type="text"
                >

                <p
                        class="field-error"
                        th:errors="*{username}"
                        th:if="${#fields.hasErrors('username')}"
                ></p>
            </div>

            <div class="form-field">
                <label for="email">Email</label>

                <input
                        autocomplete="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                        th:field="*{email}"
                        type="email"
                >

                <p
                        class="field-error"
                        th:errors="*{email}"
                        th:if="${#fields.hasErrors('email')}"
                ></p>
            </div>

            <div class="form-field">
                <label for="password">Password</label>

                <input
                        autocomplete="new-password"
                        id="password"
                        minlength="12"
                        placeholder="Create a password"
                        required
                        th:field="*{password}"
                        title="Password must contain at least 12 characters"
                        type="password"
                >

                <p
                        class="field-error"
                        th:errors="*{password}"
                        th:if="${#fields.hasErrors('password')}"
                ></p>
            </div>

            <div class="form-field">
                <label for="confirmPassword">Confirm Password</label>

                <input
                        autocomplete="new-password"
                        id="confirmPassword"
                        minlength="12"
                        placeholder="Repeat your password"
                        required
                        th:field="*{confirmPassword}"
                        type="password"
                >

                <p
                        class="field-error"
                        id="confirmPasswordError"
                        th:errors="*{confirmPassword}"
                        th:if="${#fields.hasErrors('confirmPassword')}"
                ></p>
            </div>

            <button class="primary-button" type="submit">
                Sign Up
            </button>
        </form>

        <!-- Divider -->
        <div class="social-divider">
            <span>or continue with</span>
        </div>

      
        <div class="social-buttons">
            <a class="social-button" href="#">
                <span class="google-icon">G</span>
                <span>Google</span>
            </a>

            <a class="social-button" href="#">
                <span class="facebook-icon">f</span>
                <span>Facebook</span>
            </a>
        </div>

        <p class="auth-footer">
            <span>Already have an account?</span>
            <a th:href="@{/login}">Log in</a>
        </p>

    </section>
</main>

<script>
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    function validatePasswordMatch() {
        if (password.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity("Passwords do not match.");
        } else {
            confirmPassword.setCustomValidity("");
        }
    }

    password.addEventListener("input", validatePasswordMatch);
    confirmPassword.addEventListener("input", validatePasswordMatch);
</script>


</body>
</html>
