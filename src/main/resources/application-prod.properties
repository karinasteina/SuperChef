# Preserve the database and do not execute the destructive development schema.
# A migration tool should eventually replace Hibernate schema updates.
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:db/sqlite/schema.sql
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
logging.level.org.springframework.security=WARN
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-stacktrace=never
