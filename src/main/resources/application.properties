spring.application.name=app
# Use production settings unless an active profile is supplied. A local .env
# file can override this by setting spring.profiles.active=dev.
spring.profiles.default=prod
spring.config.import=optional:file:./.env[.properties]

server.port=3500

spring.datasource.url=jdbc:sqlite:superchef.db?journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=30000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.recipes-dir=uploads/recipes
